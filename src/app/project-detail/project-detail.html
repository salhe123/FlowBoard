<section class="page">
  <a class="back" routerLink="/projects">← Projects</a>

  @if (project) {
    <h1>{{ project.name }}</h1>
    <p class="lead">{{ project.description }}</p>

    <form (submit)="add(); $event.preventDefault()">
      <input [(ngModel)]="title" name="title" type="text" placeholder="New task (starts as Open)" />
      <button type="submit">Add</button>
    </form>

    <div class="board">
      @for (step of steps; track step.id) {
        <section
          class="column"
          [attr.data-step]="step.id"
          [class.over]="overStatus === step.id"
          (dragover)="dragOver($event, step.id)"
          (dragleave)="dragLeave()"
          (drop)="drop(step.id)"
        >
          <h2>{{ step.label }}</h2>
          @if (tasksIn(step.id).length === 0) {
            <p class="empty">Drop here</p>
          }
          @for (task of tasksIn(step.id); track task.id) {
            <article
              draggable="true"
              [class.dragging]="draggingId === task.id"
              (dragstart)="dragStart(task.id)"
            >
              <p>{{ task.title }}</p>
              <div class="actions">
                <button type="button" (click)="cycle(task.id)">Next step</button>
                <button type="button" class="danger" (click)="remove(task.id)">Delete</button>
              </div>
            </article>
          }
        </section>
      }
    </div>
  } @else {
    <p>Project not found.</p>
  }
</section>
