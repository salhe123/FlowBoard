<section class="page">
  <a class="back" routerLink="/dashboard">← Dashboard</a>
  <h1>Projects</h1>

  <ul>
    @for (project of projects; track project.id) {
      <li>
        <a [routerLink]="['/projects', project.id]">
          <h2>{{ project.name }}</h2>
          <p>{{ project.description }}</p>
        </a>
      </li>
    }
  </ul>
</section>
