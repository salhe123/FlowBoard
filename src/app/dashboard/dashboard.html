<section class="page">
  <header>
    <p class="eyebrow">Dashboard</p>
    <h1>Hi, {{ name() }}</h1>
  </header>

  <div class="stats">
    <article>
      <span>{{ counts.projects }}</span>
      <p>Projects</p>
    </article>
    <article>
      <span>{{ counts.tasks }}</span>
      <p>Tasks</p>
    </article>
    <article>
      <span>{{ counts.done }}</span>
      <p>Done</p>
    </article>
  </div>

  <h2>By step</h2>
  <div class="steps">
    @for (step of counts.steps; track step.id) {
      <article [attr.data-step]="step.id">
        <span>{{ step.count }}</span>
        <p>{{ step.label }}</p>
      </article>
    }
  </div>

  <a routerLink="/projects">View projects →</a>
</section>
